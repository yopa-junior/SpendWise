<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; }
    .container { max-width: 500px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
    .header { background-color: #2563eb; color: #ffffff; padding: 24px; text-align: center; }
    .content { padding: 24px; color: #333333; line-height: 1.6; }
    .footer { padding: 16px 24px; font-size: 12px; color: #999999; text-align: center; }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Bienvenue sur SpendWise</h1>
        </div>
        <div class="content">
            <p>Bonjour {{ nom }},</p>
            <p>Ton compte SpendWise a été créé avec succès. Tu peux dès maintenant commencer à suivre tes dépenses, créer tes wallets et fixer tes premiers budgets.</p>
            <p>À très vite sur l'application.</p>
        </div>
        <div class="footer">
            SpendWise — Gestion de dépenses intelligente
        </div>
    </div>
</body>
</html>
